<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 85 512 342" width="100%" height="100%" shape-rendering="geometricPrecision">
  <defs>
    <!-- Card Boundary Clip -->
    <clipPath id="card-clip">
      <rect x="0" y="85" width="512" height="342" rx="44" />
    </clipPath>
    
    <!-- Exact Zigzag Crack Mask, preserving the shape and size from the original image file icon -->
    <mask id="crack-mask">
      <rect x="0" y="0" width="512" height="512" fill="#ffffff" />
      <path d="M 270 50 
               L 215 158 
               L 302 268 
               L 208 355 
               L 285 460" 
            fill="none" 
            stroke="#000000" 
            stroke-width="32" 
            stroke-linejoin="miter" 
            stroke-linecap="square" />
    </mask>
  </defs>

  <!-- Container applying the transparent crack -->
  <g mask="url(#crack-mask)">
    <!-- Container applying the rounded rectangle bounds -->
    <g clip-path="url(#card-clip)">
      
      <!-- Base Card Background (Neutral Light Grey, retained from the original file icon structure) -->
      <rect x="0" y="85" width="512" height="342" fill="#ced4da" />
      
      <!-- Sun Element (Lighter Accent - uses the camera lens flap color) -->
      <circle cx="168" cy="172" r="45" fill="#b0c0d0" />
      
      <!-- Left Mountain (uses the lighter accent lens flap color) -->
      <path d="M -30 427 
               L 105 255 
               C 125 230 155 230 175 255 
               L 370 427 Z" 
            fill="#b0c0d0" />
      
      <!-- Right Mountain (uses the dark camera body color) -->
      <path d="M 125 427 
               L 345 200 
               C 370 175 405 175 430 200 
               L 580 355 
               L 580 427 Z" 
            fill="#4c6680" />
            
    </g>
  </g>
</svg>
