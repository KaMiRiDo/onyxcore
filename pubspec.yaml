name: onyxcore
description: "OnyxCore — Linux-native multimedia file manager"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^3.3.1

  # Core
  google_fonts: ^6.1.0
  flutter_svg: ^2.2.4
  shared_preferences: ^2.2.3
  intl: ^0.19.0
  equatable: ^2.0.7
  watcher: ^1.2.1

  # Media Processing
  video_player: ^2.8.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  very_good_analysis: ^10.1.0

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
