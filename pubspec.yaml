name: onyxcore
description: "OnyxCore — Linux-native multimedia file manager"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^3.3.1

  # Core
  google_fonts: ^6.2.1
  flutter_svg: ^2.2.4
  intl: ^0.19.0
  equatable: ^2.0.7
  watcher: ^1.2.1
  flutter_markdown: ^0.7.1
  path: ^1.9.0
  file: ^7.0.0

  # Persistence (Drift — single source of truth)
  drift: ^2.26.0
  drift_flutter: ^0.3.0

  # Media Processing (Linux Native)
  media_kit: ^1.2.6
  media_kit_video: ^2.0.1
  media_kit_libs_video: ^1.0.7
  window_manager: ^0.5.1
  uuid: ^4.5.3
  crypto: ^3.0.6
  path_provider: ^2.1.5
  image: ^4.8.0
  audiotags: ^1.4.5
  file_selector: ^1.1.0
  sqlite3: ^3.3.2
  desktop_drop: ^0.7.1
  flutter_html: ^3.0.0
  flutter_mermaid: ^0.1.0
  flutter_html_table: ^3.0.0
  flutter_math_fork: ^0.7.4
  flutter_highlight: ^0.7.0
  flutter_staggered_grid_view: ^0.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  very_good_analysis: ^6.0.0
  mocktail: ^1.0.4
  mocktail_image_network: ^1.3.0
  drift_dev: ^2.26.0
  build_runner: ^2.5.4

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/fonts/
