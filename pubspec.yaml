name: onyxcore
description: "OnyxCore — Linux-native multimedia file manager"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^3.3.1

  # Core
  google_fonts: ^6.2.1
  flutter_svg: ^2.2.4
  shared_preferences: ^2.2.3
  intl: ^0.19.0
  equatable: ^2.0.7
  watcher: ^1.2.1
  flutter_markdown: ^0.7.1
  path: ^1.9.0

  # Media Processing (Linux Native)
  media_kit: ^1.2.6
  media_kit_video: ^2.0.1
  media_kit_libs_video: ^1.0.7
  desktop_multi_window: ^0.3.0
  window_manager: ^0.5.1
  uuid: ^4.5.3
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  file_picker: ^11.0.2
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  very_good_analysis: ^10.1.0

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
